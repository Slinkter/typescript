<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag and Drop - Chapter 8</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. Molde para el Formulario -->
    <template id="project">
      <form>
        <div class="form-control">
          <label for="title">Title</label>
          <input type="text" id="title" required />
        </div>
        <div class="form-control">
          <label for="description">Description</label>
          <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-control">
          <label for="people">People</label>
          <input type="number" id="people" step="1" min="1" max="10" required />
        </div>
        <button type="submit">ADD PROJECT</button>
      </form>
    </template>

    <!-- 2. Molde para cada Tarjeta Arrastrable -->
    <template id="single">
      <li draggable="true">
        <h2></h2>
        <h3></h3>
        <p></p>
      </li>
    </template>

    <!-- 3. Molde para las Columnas (Active y Finished) -->
    <template id="list">
      <section class="projects">
        <header>
          <h2></h2>
        </header>
        <ul></ul>
      </section>
    </template>

    <!-- Contenedor principal donde TypeScript inyecta la app -->
    <div id="app"></div>

    <script src="dist/index.js"></script>
  </body>
</html>
