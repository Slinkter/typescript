<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter 05 — Advanced Types</title>
    <link rel="stylesheet" href="index.css" />

  <body>
    <h1>Chapter 05 — Advanced Types</h1>
    <input type="text" id="input-user" placeholder="Escribe algo..." />

    <!-- Botón flotante para alternar tema (CSS puro) -->
    <input
      type="checkbox"
      id="theme-toggle"
      class="theme-toggle-input"
      aria-label="Toggle theme"
    />
    <label
      for="theme-toggle"
      class="theme-toggle-btn"
      title="Alternar tema Claro / Oscuro"
    >
      <span class="icon sun">☀️</span>
      <span class="icon moon">🌙</span>
    </label>
